# Record the day's ratios, and carry them into the repository.
#
# The container's filesystem is wiped on every deploy, and the history file is
# what the trend features read. Without this job the series only grows on the
# days somebody opens the app — which is not a series.
#
# The app records the day and the job fetches it back, so the copy in the
# repository is the app's own and needs no interpretation.
#
# Two secrets are needed, both in the repository's settings:
#   DECK_URL       the deployed app, e.g. https://multi-chart-desk.onrender.com
#   DECK_PASSWORD  the same password the app is protected with
name: Daily history

on:
  schedule:
    # 22:00 UTC is five in the morning in Bangkok, before the market opens and
    # before the day's prices are set.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record today's ratios
        env:
          DECK_URL: ${{ secrets.DECK_URL }}
          DECK_PASSWORD: ${{ secrets.DECK_PASSWORD }}
        run: |
          set -euo pipefail
          # The scanner behind the app rate-limits a shared datacenter address
          # now and then: one attempt answers 429, the next gets through. Give
          # it a few chances rather than losing the whole day to one unlucky
          # request, and fail the job loudly if the app still has nothing to
          # say — a silent green run is how a series stops growing unnoticed.
          written=0
          for attempt in 1 2 3 4; do
            resp=""
            if resp="$(curl -sS -f --max-time 300 -u "deck:$DECK_PASSWORD" \
                -X POST "$DECK_URL/api/fundamentals/history/snapshot" \
                -H 'content-type: application/json' -d '{}')"; then
              written="$(jq -r '.written // 0' <<<"$resp" 2>/dev/null || echo 0)"
              note="$(jq -r '.error // empty' <<<"$resp" 2>/dev/null || true)"
              echo "attempt $attempt: written=$written ${note:-}"
            else
              echo "attempt $attempt: the app did not answer (curl exit $?)"
            fi
            if [ "$written" -gt 0 ] 2>/dev/null; then
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 45
            fi
          done
          if ! [ "$written" -gt 0 ] 2>/dev/null; then
            echo "::error::the app recorded nothing in four attempts"
            exit 1
          fi

      - name: Carry the day into the repository
        env:
          DECK_URL: ${{ secrets.DECK_URL }}
          DECK_PASSWORD: ${{ secrets.DECK_PASSWORD }}
        run: |
          set -euo pipefail
          # The day is UTC on purpose: the app's clock in the container is UTC,
          # so that is the day the rows carry, and at 22:00 UTC it is the
          # trading day that has just closed. The Bangkok date is already
          # tomorrow's at that hour — asking for it comes back empty every
          # night while the job still reports success.
          day="$(date -u +%Y-%m-%d)"
          mkdir -p data/history
          curl -sS -f --max-time 300 -u "deck:$DECK_PASSWORD" \
            "$DECK_URL/api/fundamentals/history/file?date=$day" \
            -o "data/history/$day.jsonl"
          if [ ! -s "data/history/$day.jsonl" ]; then
            echo "::error::the app has no rows for $day — the day it recorded and the day this job asked for differ"
            exit 1
          fi
          git config user.name "sicomanzer"
          git config user.email "sicomanzer@users.noreply.github.com"
          git add "data/history/$day.jsonl"
          if git diff --cached --quiet; then
            echo "today was already recorded"
          else
            git commit -m "History snapshot: $day"
            git push
          fi
